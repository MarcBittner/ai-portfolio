[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vigil"
version = "0.1.0"
description = "Public observability + SOC monitoring — probes the ai-portfolio demos and itself, tiered dashboard, security/compliance posture, and an LLM incident summarizer"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Durable MongoDB storage backend (imported lazily in _store_mongo.py, only when
# MONGODB_URI is set). The default SQLite path + the test suite never need this.
mongo = ["pymongo>=4.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) in argument defaults is the framework's idiomatic DI;
# B008 (function call in default) is a false positive for it.
"src/vigil/api.py" = ["B008"]
